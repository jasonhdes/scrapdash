<VirtualHost *:80>
    ServerName scrapdash.local
    DocumentRoot "C:/xampp/htdocs/scrapdash/backend/public"

    <Directory "C:/xampp/htdocs/scrapdash/backend/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/scrapdash.local-error.log"
    CustomLog "logs/scrapdash.local-access.log" common
</VirtualHost>

<VirtualHost *:443>
    ServerName scrapdash.local
    DocumentRoot "C:/xampp/htdocs/scrapdash/backend/public"

    <Directory "C:/xampp/htdocs/scrapdash/backend/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "conf/ssl.key/server.key"

    ErrorLog "logs/scrapdash.local-ssl-error.log"
    CustomLog "logs/scrapdash.local-ssl-access.log" common
</VirtualHost>
